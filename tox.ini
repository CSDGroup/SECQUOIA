# For more information about tox, see https://tox.readthedocs.io/en/latest/
[tox]
envlist = py{310,311,312,313}-{linux,macos,windows}
isolated_build=true
skip_missing_interpreters = true

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313

[gh-actions:env]
PLATFORM =
    ubuntu-latest: linux
    macos-latest: macos
    windows-latest: windows

[testenv]
platform =
    macos: darwin
    linux: linux
    windows: win32
passenv =
    CI
    GITHUB_ACTIONS
    DISPLAY
    XAUTHORITY
    NUMPY_EXPERIMENTAL_ARRAY_FUNCTION
    PYVISTA_OFF_SCREEN
    QT_QPA_PLATFORM
    MPLBACKEND

setenv =
    QT_QPA_PLATFORM = offscreen
    MPLBACKEND = Agg
    PYVISTA_OFF_SCREEN = true
    QT_API = pyside6

extras =
    testing
# Coverage settings (source, omit, fail_under) live in pyproject.toml under
# [tool.coverage.*]; --cov with no value picks them up.
commands = pytest {posargs} --color=yes --cov --cov-report=xml --cov-report=term-missing:skip-covered
