# Runs the test suite, then publishes to PyPI on a v* tag.
# https://help.github.com/en/actions/language-and-framework-guides/using-python-with-github-actions#publishing-to-package-registries
name: tests

on:
  push:
    branches:
      - main
    tags:
      - "v*" # Push events to matching v*, i.e. v1.0, v20.15.10
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  # A new push to a PR cancels the run still going for the previous one.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  matrix:
    name: choose matrix
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.choose.outputs.include }}
    steps:
      - id: choose
        shell: bash
        env:
          QUICK: >-
            [{"platform":"ubuntu-latest","python-version":"3.12"}]
          FULL: >-
            [{"platform":"ubuntu-latest","python-version":"3.10"},
            {"platform":"ubuntu-latest","python-version":"3.11"},
            {"platform":"ubuntu-latest","python-version":"3.12"},
            {"platform":"ubuntu-latest","python-version":"3.13"},
            {"platform":"windows-latest","python-version":"3.12"},
            {"platform":"macos-latest","python-version":"3.12"}]
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            include="$QUICK"
          else
            include="$FULL"
          fi
          # Heredoc form, so a value that grows a newline still writes cleanly.
          {
            echo "include<<JSON"
            echo "$include"
            echo "JSON"
          } >> "$GITHUB_OUTPUT"

  test:
    name: ${{ matrix.platform }} py${{ matrix.python-version }}
    needs: [matrix]
    runs-on: ${{ matrix.platform }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}

    steps:
      - uses: actions/checkout@v4
        with:
          # setuptools_scm derives the version from tags.
          fetch-depth: 0

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # these libraries enable testing on Qt on linux
      - uses: tlambert03/setup-qt-libs@v1

      # strategy borrowed from vispy for installing opengl libs on windows
      - name: Install Windows OpenGL
        if: runner.os == 'Windows'
        run: |
          git clone --depth 1 https://github.com/pyvista/gl-ci-helpers.git
          powershell gl-ci-helpers/appveyor/install_opengl.ps1

      # note: if you need dependencies from conda, considering using
      # setup-miniconda: https://github.com/conda-incubator/setup-miniconda
      # and
      # tox-conda: https://github.com/tox-dev/tox-conda
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install setuptools tox tox-gh-actions

      # this runs the platform-specific tests declared in tox.ini
      - name: Test with tox
        uses: aganders3/headless-gui@v2
        with:
          run: python -m tox
        env:
          PLATFORM: ${{ matrix.platform }}

      # One upload is enough: coverage is identical across the matrix apart
      # from platform-specific branches, and duplicate uploads confuse the
      # codecov diff on pull requests.
      - name: Upload coverage to Codecov
        if: matrix.platform == 'ubuntu-latest' && matrix.python-version == '3.12'
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

  # Stable name for the required status check: the matrix job names change
  # between pull requests and pushes, so branch protection cannot depend on them.
  tests-passed:
    name: tests passed
    needs: [test]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if any test job did not succeed
        if: needs.test.result != 'success'
        run: |
          echo "test job result: ${{ needs.test.result }}"
          exit 1
      - run: echo "All test jobs succeeded."

  deploy:
    # this will run when you have tagged a commit, starting with "v*"
    # and requires that you have put your twine API key in your
    # github secrets (see readme for details)
    needs: [tests-passed]
    runs-on: ubuntu-latest
    if: contains(github.ref, 'tags')
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Build package
        run: |
          python -m pip install --upgrade pip
          pip install -U setuptools setuptools_scm wheel twine build
          git tag
          python -m build .
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
